<div class="table-container">
  <table class="custom-table">
    <thead>
      <tr [ngClass]="{ hide: isConditionTrue }">
        <th
          [ngClass]="{
          'blue-header': blueHeader===true,
          'violet-header':violetHeader===true}"
          *ngFor="let header of tableHeaders"
        >
          {{ header }}
        </th>
      </tr>
    </thead>
    <tbody>
      <tr
        *ngFor="let row of tableData; let i = index"
        [ngClass]="{
          'even-row-color': evenRowBlueColor && i % 2 === 0,
          'odd-row-color': oddRowBlueColor && i % 2 !== 0,
          'even-row-color-1': evenRowVioletColor && i % 2 === 0,
          'odd-row-color-1': oddRowVioletColor && i % 2 !== 0
        }"
      >
        <td *ngFor="let header of tableHeaders">{{ row[header] }}</td>
      </tr>
    </tbody>
  </table>
</div>
