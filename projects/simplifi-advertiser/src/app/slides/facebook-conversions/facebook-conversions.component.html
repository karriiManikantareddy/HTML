<slide *ngIf="loading || totals" [loading]="loading" name="Facebook Conversions">
  <section class="slide overview">
    <slide-header text="Facebook Conversions"></slide-header>
    <overview-cmp
      [totals]="totals"
      [series]="series"
      [chartConfig]="chartConfig"
      [kpis]="kpis"
      ></overview-cmp>
    <slide-footer slideName="facebook-overview"></slide-footer>
  </section>
</slide>
