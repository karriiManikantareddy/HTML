      - impressions
      - clicks
      - ctr
      - conversions
      - cost
      - cpc
  email_totals:
    dataset: dm_email_combined
    dimensions: [advertiser]
    metrics:
      - records
      - clicks
      - opens
      - click_rate
      - open_rate
  email_weekly:
    dataset: dm_email_combined
