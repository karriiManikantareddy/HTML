<slide *ngIf="loading || (geoFences && !geoFences.isEmpty())" [loading]="loading" name="Geofence Conversion Zone">
  <section class="slide campaigns">
    <slide-header text="Geofence Conversion Zone"></slide-header>
    <simplifi-table [items]="geoFences" [kpis]="kpis" header="Top 10 Geofence Conversion Zone"></simplifi-table>
    <slide-footer slideName="simplifi-geofencing"></slide-footer>
  </section>
</slide>
