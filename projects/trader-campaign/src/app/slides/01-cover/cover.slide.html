<slide [loading]="loading" name="Cover">
  <section class="slide slide-cover">
    <div class="main">
      <div class="wrap-head">
        <h3>{{metadata?.name}}</h3>
        <div class="dates">{{metadata?.startDate | date}} - {{metadata?.endDate | date}}</div>
      </div>

    </div>
    <div class="slide-footer">
      <img src="assets/img/logo_blackwhite.png" class="frontpage-logo"/>
    </div>
  </section>
</slide>
