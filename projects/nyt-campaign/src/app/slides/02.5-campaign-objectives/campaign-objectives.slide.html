<slide name="Campaign Objectives">
  <section class="slide" [style.background-color]="backgroundColor">
    <header>
      <h2 [ngClass]="fontStyling">Campaign Objectives</h2>
    </header>
    <div class="outer-element">
      <div class="inner-left-column">
        <div class="main">
          <div class="header" [ngClass]="fontStyling">Objectives</div>
          <div class="outer-container">
            <text-editor id="objectives" class="campaign-objectives" [ngClass]="fontStyling"></text-editor>
          </div>
        </div>
        <div class="main">
          <div class="header" [ngClass]="fontStyling">KPIs</div>
          <div class="outer-container">
            <text-editor id="kpi" class="campaign-objectives" [ngClass]="fontStyling"></text-editor>
          </div>
        </div>
        <div class="main">
          <div class="header" [ngClass]="fontStyling">Creatives</div>
          <div class="outer-container">
            <text-editor id="creatives" class="campaign-objectives" [ngClass]="fontStyling"></text-editor>
          </div>
        </div>
      </div>
      <div class="inner-right-column">
        <div class="main">
          <div class="header" [ngClass]="fontStyling">Geo</div>
          <div class="outer-container">
            <text-editor id="ge0" class="campaign-objectives" [ngClass]="fontStyling"></text-editor>
          </div>
        </div>
        <div class="main">
          <div class="header" [ngClass]="fontStyling">Targeting</div>
          <div class="outer-container">
            <text-editor id="targeting" class="campaign-objectives" [ngClass]="fontStyling"></text-editor>
          </div>
        </div>
      </div>
    </div>
  </section>
</slide>
