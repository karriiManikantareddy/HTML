<slide *ngIf="totals" [loading]="loading" name="NYT.com Native Drivers Overview">
  <section class="slide overview" [style.background-color]="backgroundColor">
    <header class="slide-header">
      <h2 [ngClass]="fontStyling">NYT.com Native Drivers Overview</h2>
    </header>
    <div class="main">
      <div class="statistic-icons">
<!--         <div class="statistic-icons-item">
          <icon type="checkmark"></icon>
          <div class="wrap-title">
            <span class="num">{{totals?.booked_impressions | localeNumber}}</span>
            <span class="title">booked impressions</span>
          </div>
        </div> -->
        <div class="statistic-icons-item">
          <icon [ngClass]="fontStyling" type="eye"></icon>
          <div class="wrap-title">
            <span class="num" [ngClass]="fontStyling">{{totals?.dfp_total_line_item_level_impressions | localeNumber}}</span>
            <span class="title" [ngClass]="fontStyling">impressions</span>
          </div>
        </div>
<!--         <div class="statistic-icons-item">
          <icon type="percent"></icon>
          <div class="wrap-title">
            <span class="num">{{totals?.delivered_rate | percent}}</span>
            <span class="title">% Delivered</span>
          </div>
        </div> -->
        <div class="statistic-icons-item">
          <icon [ngClass]="fontStyling" type="hand"></icon>
          <div class="wrap-title">
            <span class="num" [ngClass]="fontStyling">{{totals?.dfp_total_line_item_level_clicks | localeNumber}}</span>
            <span class="title" [ngClass]="fontStyling">clicks</span>
          </div>
        </div>
        <div class="statistic-icons-item">
          <icon [ngClass]="fontStyling" type="click"></icon>
          <div class="wrap-title">
            <span class="num" [ngClass]="fontStyling">{{totals?.dfp_ctr | percent}}</span>
            <span class="title" [ngClass]="fontStyling">CTR</span>
          </div>
        </div>
      </div>
      <div>
        <h6 [ngClass]="fontStyling+'_grey'">
          Delivery by day
          <legend [items]="legendItems" class="right"></legend>
        </h6>
        <div class="chart-content">
          <chart type="column" [series]="chartSeries" [options]="chartOptions"></chart>
        </div>
      </div>
    </div>
    <footer class="slide-footer"></footer>
  </section>
</slide>
