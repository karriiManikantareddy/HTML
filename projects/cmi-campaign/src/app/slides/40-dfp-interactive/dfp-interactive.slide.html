<slide *ngIf="hasDFP" [loading]="loading" name="Cox.com Interactive Performance">
  <section class="slide overview">
    <header class="slide-header">
      <h1 class="title">
        COX.COM
      </h1>
      <div class="dates-wrapper">
        Flight Dates:
        <text-editor
          class="dates"
          [plainText]="true"
          id="flight_dates"
          [maxLength]="28"
        ></text-editor>
      </div>
    </header>
    <div class="main">
      <h2 class="subtitle">Interactive Performance</h2>
      <table class="table">
        <thead class="table__header">
          <tr class="table__row table__row--header">
            <th class="table__cell table__cell--header"></th>
            <th class="table__cell table__cell--header" *ngFor="let header of headers">
              <text-editor [plainText]="true" [id]="header" placeholder="Editable"></text-editor>
            </th>
          </tr>
        </thead>
        <tbody>
          <tr class="table__row" *ngFor="let metric of metrics">
            <td class="table__cell table__cell--name">{{metric.name_1}} <span>{{metric.description}}</span></td>
            <td class="table__cell" *ngFor="let text of headers">
              <text-editor [plainText]="true"
                           [id]="getName(text, metric.metric)"
                           placeholder="Editable"
                           maxLength="6"></text-editor>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</slide>
