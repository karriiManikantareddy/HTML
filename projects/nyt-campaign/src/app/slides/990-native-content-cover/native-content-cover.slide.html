<slide [loading]="loading" *ngIf="nativeTotals" name="Paid Post Overview Cover">
  <section class="slide slide-cover" [style.background-color]="backgroundColor">
    <header class="slide-header">
      <div class="logo">
        <img [src]="backgroundColor === '#FFFFFF' ? 'assets/img/nyt-advertising-top-left.png' : 'assets/img/nyt-advertising-top-left-white.png'" alt="">
      </div>
    </header>
    <div class="main">
      <p class="header" [ngClass]="fontStyling">Paid Post Overview</p>
    </div>
    <div class="slide-footer">
    </div>
  </section>
</slide>
