<div class="slide-header">
  <div class="text-row">
    <h2 class="text">{{text}}</h2>
    <div class="date-section">
      <h3 class="dates">{{metadata?.name}} &nbsp;&nbsp;&nbsp; | &nbsp;&nbsp;&nbsp; {{currentDate | date:dateOptions}}</h3>
      <h3>Reporting Dates: {{metadata?.startDate | date:dateOptions}} - {{metadata?.endDate | date:dateOptions}}</h3>
    </div>
  </div>
  <div class="divider"></div>
</div>
