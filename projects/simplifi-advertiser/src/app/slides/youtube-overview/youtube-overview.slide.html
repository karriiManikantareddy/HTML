<slide *ngIf="loading || totals" [loading]="loading" name="Youtube Overview">
  <section class="slide overview">
    <slide-header text="Youtube Overview"></slide-header>
    <overview-cmp
      [totals]="totals"
      [series]="series"
      [chartConfig]="chartConfig"
      [kpis]="kpis"
      ></overview-cmp>
  </section>
</slide>
