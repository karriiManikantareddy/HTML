<slide *ngIf="totals" [loading]="loading" name="Branded Content Overview">
  <section class="slide overview">
    <header class="slide-header">
      <h2>
        Branded Content Overview
        <header-logo></header-logo>
      </h2>
    </header>
    <div class="main">
      <div class="statistic-icons">
        <div class="statistic-icons-item">
          <icon type="pageviews"></icon>
          <div class="wrap-title">
            <span class="num">{{totals?.pageviews?.value | number}}</span>
            <span class="title">{{totals?.pageviews?.displayName}}</span>
          </div>
        </div>
        <div class="statistic-icons-item">
          <icon type="user"></icon>
          <div class="wrap-title">
            <span class="num">{{totals?.users?.value | number}}</span>
            <span class="title">{{totals?.users?.displayName}}</span>
          </div>
        </div>
        <div class="statistic-icons-item">
          <icon type="total-time"></icon>
          <div class="wrap-title">
            <span class="num">{{totals?.time_on_page?.value | duration}}</span>
            <span class="title">{{totals?.time_on_page?.displayName}}</span>
          </div>
        </div>
      </div>
      <div>
        <h6>
          Delivery by day
          <legend [items]="legendItems" class="right"></legend>
        </h6>
        <div class="chart-content">
          <chart type="column" [series]="chartSeries" [options]="chartOptions"></chart>
        </div>
      </div>
    </div>
    <footer class="slide-footer"></footer>
  </section>
</slide>
