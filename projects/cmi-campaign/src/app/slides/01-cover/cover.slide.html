<slide [loading]="loading" name="Cover">
  <section class="slide slide-cover">
    <div class="logo">
      <img src="assets/img/cmi-logo.png" alt="">
    </div>
    <div class="main">
      <div class="wrap-head">
        <text-editor class="name" id="client_name" [plainText]="true" placeholder="Client Name Here"></text-editor>
        <text-editor class="title" id="campaign_cover_desc" [plainText]="true" placeholder="Campaign Performance & Insights"></text-editor>
        <text-editor class="date" id="date" [plainText]="true" placeholder="INSERT DATE"></text-editor>
      </div>
    </div>
  </section>
</slide>
