<slide *ngIf="hasAttribution" [loading]="loading" name="Attribution Overview">

    <slide-header text="Attribution Overview"></slide-header>
    <overview-cmp
      [totals]="totals"
      [series]="series"
      [chartConfig]="chartConfig"
    ></overview-cmp>
  </section>
</slide>
