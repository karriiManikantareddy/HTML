<slide name="Campagne opzet">
  <section class="slide slide-cover">
    <div class="main">
      <div class="header"></div>
      <div class="body-container">
        <div class="left">
            <div class="top">
                <app-table [tableHeaders]="headers" [tableData]="data" [isConditionTrue]="isConditionTrue" [violetHeader]='violetHeader'[evenRowVioletColor]="evenRowVioletColor" [oddRowVioletColor]="oddRowVioletColor"></app-table>
            </div>
            <div class="bottom">

            </div>
        </div>
        <div class="right"></div>
      </div>
      <div class="footer">
        <!-- <img src="../../../assets/img/cox-logo.png" alt="logo" /> -->
      </div>
      <img
        src="../../../assets/img/half-circle.png"
        alt="half-circle"
        class="half-circle"
      />
      <div class="image-content">
        <h3 [ngStyle]="{ color: 'white', 'font-size': '21px' }">
          Key Insights:
        </h3>
        <div class="input">
          <div class="input-one">
            <text-editor class="text-editor"></text-editor>
          </div>
          <div class="input-two">
            <text-editor class="text-editor"></text-editor>
          </div>
          <div class="input-three">
            <text-editor class="text-editor"></text-editor>
          </div>
        </div>
      </div>
    </div>
  </section>
</slide>
