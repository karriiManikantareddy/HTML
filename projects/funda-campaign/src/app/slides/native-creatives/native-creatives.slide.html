<slide name="Top Creatives">
  <section class="slide">
    <div class="blue-container">
      <header class="slide-header">
        <h1>
          Top creatives
        </h1>
      </header>
      <header-line style="width: 100%;"></header-line>
      <div class="box"><h6>Creatives</h6></div>
      <div class="textbox-image-container">
        <div class="screenshot-text-container">
          <span class="metric-num"><number-editor [plainText]="true" placeholder="Insert" id="text1" class="white"></number-editor></span>        
          <span class="metric-num"><number-editor [plainText]="true" placeholder="Insert" id="text2" class="white"></number-editor></span>          
          <span class="metric-num"><number-editor [plainText]="true" placeholder="Insert" id="text3" class="white"></number-editor></span>         
        </div>
        <div class="main-container">
          <div class="screenshot-container">
            <image-upload id="screenshot1" class="screenshot"></image-upload>
          </div>
          <div class="screenshot-container">
            <image-upload id="screenshot2" class="screenshot"></image-upload>
          </div>
          <div class="screenshot-container">
            <image-upload id="screenshot3" class="screenshot"></image-upload>
          </div>
        </div>
      </div>
    </div>
  </section>
</slide>
