<slide *ngIf="loading || totals" [loading]="loading" name="Onsite Video Overview">
  <divider></divider>
  <section class="slide overview">
    <slide-header text="Onsite Video"></slide-header>
    <overview-cmp
      [totals]="totals"
      [series]="series"
      [chartConfig]="chartConfig"
    ></overview-cmp>
    <slide-footer></slide-footer>
  </section>
</slide>
