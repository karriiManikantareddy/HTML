<slide [loading]="loading" name="Screenshot Mobiles">
  <section class="slide slide-screenshot" [style.background-color]="backgroundColor">
    <header class="slide-header">
      <h2 [ngClass]="fontStyling">Screenshots</h2>
    </header>
    <div class="main">
      <div class="mobile-screenshot" [ngClass]="fontStyling+'_phone'" *ngFor="let screenshot of screenshots">
        <image-upload id="{{screenshot.id}}" class="image"></image-upload>
      </div>
    </div>
    <footer class="slide-footer"></footer>
  </section>
</slide>
