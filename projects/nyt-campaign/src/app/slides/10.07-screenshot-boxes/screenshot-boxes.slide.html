<slide name="Screenshots">
  <section class="slide slide-screenshot" [style.background-color]="backgroundColor">
    <header class="slide-header">
      <h2 [ngClass]="fontStyling">Screenshots</h2>
    </header>
    <div class="main">
      <image-upload id="screenshot_box_1" class="boxes box-1"></image-upload>
      <image-upload id="screenshot_box_2" class="boxes box-2"></image-upload>
    </div>
    <footer class="slide-footer"></footer>
  </section>
</slide>
