<slide [loading]="loading" name="Top Section & Subsection VCR Performance Benchmarks">
  <section class="slide overview" [style.background-color]="backgroundColor">
    <header class="slide-header">
      <h2 [ngClass]="fontStyling">{{metadata?.advertiser || metadata?.name}} Top Section & Subsection VCR Performance</h2>
    </header>
    <div class="main">
      <div class="charts-container">
        <div class="chart-content">
          <chart type="column" [series]="sectionVcrChartSeries" [options]="sectionVcrChartOptions" [bgcolor]="backgroundColor"></chart>
        </div>
        <div class="chart-content">
          <chart type="column" [series]="subsectionVcrChartSeries" [options]="subsectionVcrChartOptions" [bgcolor]="backgroundColor"></chart>
        </div>
      </div>
    </div>
    <div class="source" [ngClass]="fontStyling">
      Source: NYT Google Ad Manager local delivery
    </div>
    <footer class="slide-footer"></footer>
  </section>
</slide>
