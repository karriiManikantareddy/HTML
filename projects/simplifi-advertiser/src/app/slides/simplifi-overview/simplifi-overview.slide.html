<slide *ngIf="loading || totals" [loading]="loading" name="Overview">
  <section class="slide overview">
    <slide-header text="Overview"></slide-header>
    <overview-cmp
      [totals]="totals"
      [series]="series"
      [chartConfig]="chartConfig"
      [kpis]="kpis"
      [gauge]="true"
    ></overview-cmp>
    <slide-footer slideName="simplifi-overview"></slide-footer>
  </section>
</slide>
