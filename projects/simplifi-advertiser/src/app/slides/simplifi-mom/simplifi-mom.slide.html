<slide *ngIf="loading || totals" [loading]="loading" name="Month over Month">
  <section class="slide overview">
    <slide-header text="Month over Month"></slide-header>
    <overview-cmp
      [totals]="totals"
      [comparisons]="lastPeriod"
      [kpis]="kpis"
      [gauge]="true"
    ></overview-cmp>
    <slide-footer slideName="simplifi-mom"></slide-footer>
  </section>
</slide>
