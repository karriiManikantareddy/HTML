<slide *ngIf="totals" [loading]="loading" name="Overzicht performance">
  <section class="slide overview">
    <div class="blue-container">
    <header class="slide-header">
      <h1>
        Campagne overzicht
      </h1>
    </header>
    <header-line></header-line>
    <div class="box"><h6>Resultaten campagne</h6></div>
    <div class="main">
      <div class="chart">
        <h6>
          Delivery by day
          <legend [items]="legendItems" class="right"></legend>
        </h6>
        <div class="chart-content">
          <chart type="column" [series]="chartSeries" [options]="chartOptions" [axisLabelColor]="'#000000'"></chart>
        </div>
      </div>
      <div class="cards-container">
        <div class="card-box" toggle name="Contractwaarde">
          <div class="orange-box" [ngClass]="templateType === 'consumers' ? 'consumers' : 'business'">
            <h6>Contractwaarde</h6>
          </div>
          <span class="metric-num"><number-editor class="number-editor" [plainText]="true" placeholder="" [defaultText]="metadata?.totalAmount | currency:currencyOptions" id="Contractwaarde"></number-editor></span>
        </div>
        <div class="card-box">
          <div class="orange-box" [ngClass]="templateType === 'consumers' ? 'consumers' : 'business'">
            <h6>Impressies</h6>
          </div>
          <span class="metric-num"><number-editor class="number-editor" [plainText]="true" placeholder="" [defaultText]="totals?.dfp_total_line_item_level_impressions | number" id="Impressies"></number-editor></span>        
        </div>
        <div class="card-box">
          <div class="orange-box" [ngClass]="templateType === 'consumers' ? 'consumers' : 'business'"> 
            <h6>Kilkken</h6>
          </div>
          <span class="metric-num"><number-editor class="number-editor" [plainText]="true" placeholder="" [defaultText]="totals?.dfp_total_line_item_level_clicks | number" id="Kilkken"></number-editor></span>       
        </div>
        <div class="card-box">
          <div class="orange-box" [ngClass]="templateType === 'consumers' ? 'consumers' : 'business'">
            <h6>CTR</h6>
          </div>
          <span class="metric-num"><number-editor class="number-editor" [plainText]="true" placeholder="" [defaultText]="totals?.ctr | percent" id="CTR"></number-editor></span>              
        </div>
        <div class="card-box" name="Viewability" toggle>
          <div class="orange-box" [ngClass]="templateType === 'consumers' ? 'consumers' : 'business'">
            <h6>Viewability</h6>
          </div>
          <span class="metric-num"><number-editor class="number-editor" [plainText]="true" placeholder="" [defaultText]="totals?.viewable_rate | percent"  id="Viewability"></number-editor></span>              
        </div>
      </div>
    </div>
    </div>
  </section>
</slide>
