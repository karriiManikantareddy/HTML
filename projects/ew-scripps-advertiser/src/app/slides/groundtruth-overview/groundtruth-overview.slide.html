<slide *ngIf="loading || totals" [loading]="loading" name="Hyperlocal Overview">
  <section class="slide overview">
    <slide-header text="Hyperlocal Overview"></slide-header>
    <overview-cmp
      [totals]="totals"
      [series]="series"
      [chartConfig]="chartConfig"
      header="Top 5 Ads"
    ></overview-cmp>
  </section>
</slide>
