params: [advertiser]
rename_dimensions:
  dm_social_combined: {}
data:
  social_totals:
    dataset: dm_social_combined
    dimensions: [advertiser]
    metrics:
      - impressions
      - link_clicks
      - link_clicks_ctr
      - engagements
      - facebook_conversions
      - landing_page_views
  social_advertiser_by_week:
    dataset: dm_social_combined
    dimensions: [advertiser]
    rollup: week
    metrics:
      - impressions
      - link_clicks
      - link_clicks_ctr
      - landing_page_views
  social_campaign:
    dataset: dm_social_combined
    dimensions: [advertiser, campaign]
    metrics:
      - impressions
      - link_clicks
      - link_clicks_ctr
      - engagements
      - facebook_conversions
      - landing_page_views
  social_ad:
    dataset: dm_social_combined
    dimensions: [advertiser, campaign, ad]
    metrics:
      - impressions
      - link_clicks
      - link_clicks_ctr
      - engagements
      - facebook_conversions
      - landing_page_views
  social_platform:
    dataset: dm_social_combined
    dimensions: [advertiser, platform]
    metrics:
      - impressions
      - link_clicks
      - link_clicks_ctr
      - engagements
      - facebook_conversions
      - landing_page_views
  display_totals:
    dataset: dm_display_combined
    dimensions: [advertiser]
    metrics:
      - impressions
      - clicks
      - ctr
      - conversions
      - cost
      - cpc
  display_weekly:
    dataset: dm_display_combined
    dimensions: [advertiser]
